services:
  docket:
    build: .
    ports:
      - "127.0.0.1:${PORT:-7100}:7100"
    environment:
      DOCKET_HOSTS: ${DOCKET_HOSTS:-}
      DOCKET_URL: ${DOCKET_URL:-}
      DOCKET_WEBHOOK_ALLOW_PRIVATE: ${DOCKET_WEBHOOK_ALLOW_PRIVATE:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
